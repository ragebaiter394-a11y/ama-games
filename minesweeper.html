<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minesweeper</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;padding:0;background:#17120d;color:#efe6d6;font-family:Georgia,'Times New Roman',serif}
.wrap{max-width:460px;margin:0 auto;padding:14px 12px 16px;background:radial-gradient(ellipse at 50% 0,#3a2a1b 0,#17120d 70%)}
h1{font-size:22px;margin:0 0 2px;text-align:center;letter-spacing:.5px}
.sub{font-size:12px;opacity:.7;text-align:center;margin:0 0 12px}
.row{display:flex;gap:8px;margin:8px 0}
button{flex:1;font:600 13px Georgia,serif;letter-spacing:1px;text-transform:uppercase;color:#efe6d6;background:#2b2118;border:1px solid #5a4630;border-radius:10px;padding:11px 6px}
button:active{transform:scale(.97)}button.on{background:#c9a24a;color:#1b140c;border-color:#c9a24a}button.gold{background:#c9a24a;color:#1b140c}
.status{text-align:center;font-size:15px;min-height:22px;margin:8px 0 2px}.hint{text-align:center;font-size:11px;opacity:.6}
.hide{display:none!important}.lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.7;margin:10px 0 4px}

.bar{display:flex;justify-content:space-between;font-size:14px;margin:4px 2px 8px}:root{--m:min(10.4vw,44px)}.field{display:grid;grid-template-columns:repeat(8,var(--m));gap:3px;justify-content:center}
.m{width:var(--m);height:var(--m);display:flex;align-items:center;justify-content:center;background:#3a2c1e;border:1px solid #5a4630;border-radius:6px;font:700 calc(var(--m)*.55) Arial,sans-serif}
.m.o{background:#1f1812;border-color:#2b2118}.m.bad{background:#7a2a24}.n1{color:#5aa9e6}.n2{color:#5cc26a}.n3{color:#e8574c}.n4{color:#9b72e0}.n5{color:#e0a34a}.n6{color:#4cc9c0}.n7{color:#ddd}.n8{color:#aaa}</style></head><body><div class="wrap"><h1>💣 Minesweeper</h1><p class="sub">Buka semua kotak aman. Mode 🚩 untuk memasang bendera.</p>
<div class="bar"><span>💣 <b id="left">0</b></span><span id="face">🙂</span><span>⏱ <b id="tm">0</b></span></div>
<div class="field" id="f"></div><div class="status" id="st"></div>
<div class="row"><button id="mode">⛏️ Mode: Buka</button><button class="gold" id="again">Game baru</button></div></div><script>
const W=8,H=10,N=12,$=id=>document.getElementById(id);let mine,open,flag,over,placed,flagMode=false,t0,timer,t=0;
function nb(i){const r=Math.floor(i/W),c=i%W,o=[];for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){if(!a&&!b)continue;const R=r+a,C=c+b;if(R>=0&&R<H&&C>=0&&C<W)o.push(R*W+C)}return o}
const cnt=i=>nb(i).filter(j=>mine[j]).length;
function init(){mine=Array(W*H).fill(false);open=Array(W*H).fill(false);flag=Array(W*H).fill(false);over=false;placed=false;clearInterval(timer);t=0;$('tm').textContent=0;$('face').textContent='🙂';$('st').textContent='';draw()}
function place(s){const c=[...Array(W*H).keys()].filter(x=>x!==s&&!nb(s).includes(x));for(let k=0;k<N;k++)mine[c.splice(Math.floor(Math.random()*c.length),1)[0]]=true;placed=true;timer=setInterval(()=>{t++;$('tm').textContent=t},1000)}
function tap(i){if(over)return;if(flagMode){if(!open[i]){flag[i]=!flag[i];draw()}return}
 if(flag[i]||open[i])return;if(!placed)place(i);
 if(mine[i]){over=true;clearInterval(timer);open[i]=true;$('face').textContent='😵';$('st').textContent='💥 Kena ranjau!';draw(i);return}
 const st=[i];while(st.length){const x=st.pop();if(open[x])continue;open[x]=true;flag[x]=false;if(!cnt(x))for(const y of nb(x))if(!open[y]&&!mine[y])st.push(y)}
 if(open.filter(Boolean).length===W*H-N){over=true;clearInterval(timer);$('face').textContent='😎';$('st').textContent='🏆 Menang! Waktu '+t+' detik';for(let k=0;k<W*H;k++)if(mine[k])flag[k]=true}
 draw()}
function draw(hit){const f=$('f');f.innerHTML='';
 for(let i=0;i<W*H;i++){const d=document.createElement('div');d.className='m';
  if(over&&mine[i]&&!flag[i]){d.textContent='💣';d.classList.add(i===hit?'bad':'o')}
  else if(flag[i]&&!open[i])d.textContent='🚩';
  else if(open[i]){d.classList.add('o');const c=cnt(i);if(c){d.textContent=c;d.classList.add('n'+c)}}
  let pt;d.onclick=()=>tap(i);
  d.addEventListener('touchstart',()=>{pt=setTimeout(()=>{if(!over&&!open[i]){flag[i]=!flag[i];pt=null;draw()}},450)},{passive:true});
  d.addEventListener('touchend',e=>{if(pt===null){e.preventDefault()}clearTimeout(pt)});
  f.appendChild(d)}
 $('left').textContent=N-flag.filter(Boolean).length}
$('mode').onclick=()=>{flagMode=!flagMode;$('mode').textContent=flagMode?'🚩 Mode: Bendera':'⛏️ Mode: Buka';$('mode').classList.toggle('on',flagMode)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInterval(timer);else if(placed&&!over){clearInterval(timer);timer=setInterval(()=>{t++;$('tm').textContent=t},1000)}});
$('again').onclick=init;init();
</script></body></html>
